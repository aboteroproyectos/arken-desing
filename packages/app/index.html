<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARKEN DISEÑO</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand"><img id="brand-logo" alt="ARKEN DISEÑO" /><span><b>ARKEN <span>DISEÑO</span></b><small>FAMILIA ARKEN 360</small></span></span>
      <div class="group">
        <button id="lote01" title="Cargar el proyecto Casa Lote 01 · Bosque de Agua">Proyecto Lote 01</button>
        <button id="new" title="Modelo nuevo de ejemplo">Nuevo</button>
        <button id="open" title="Abrir un modelo .arken.json">Abrir</button>
        <button id="save" title="Descargar el modelo como .arken.json">Guardar</button>
        <input id="file" type="file" accept="application/json,.json" hidden />
      </div>
      <label class="group">Vista
        <select id="view"></select>
      </label>
      <button id="fit" title="Ajustar a la ventana (Inicio)">Ajustar</button>
      <div class="group" id="disciplines" aria-label="Disciplinas visibles"></div>
      <div class="group" role="toolbar" aria-label="Herramientas">
        <button data-tool="select" title="Seleccionar y mover (V)">Seleccionar <kbd>V</kbd></button>
        <button data-tool="wall" title="Muro (M)">Muro <kbd>M</kbd></button>
        <button data-tool="door" title="Puerta (P)">Puerta <kbd>P</kbd></button>
        <button data-tool="window" title="Ventana (N)">Ventana <kbd>N</kbd></button>
        <button data-tool="device" title="Equipo o salida de red (E)">Equipo <kbd>E</kbd></button>
        <button data-tool="run" title="Recorrido de tubería o canalización (R)">Recorrido <kbd>R</kbd></button>
        <button data-tool="text" title="Texto (T)">Texto <kbd>T</kbd></button>
        <button data-tool="dim" title="Cota (C)">Cota <kbd>C</kbd></button>
      </div>
      <label class="group" hidden>Receta <select id="layerset"></select></label>
      <select id="symbol" title="Símbolo a insertar" hidden></select>
      <select id="system" title="Sistema del recorrido" hidden></select>
      <div class="group">
        <button id="undo" title="Deshacer (Ctrl+Z)">↶</button>
        <button id="redo" title="Rehacer (Ctrl+Y)">↷</button>
      </div>
      <div class="group" aria-label="Guardar y reportes">
        <button id="package" class="primary" title="Guardar todos los planos (PDF y DXF), el juego completo, el modelo y las memorias en un paquete .zip">Guardar planos</button>
        <button id="report" title="Ver y descargar las memorias de cálculo de cada diseño">Memorias</button>
      </div>
      <div class="group" aria-label="Exportar plano">
        <button data-export="pdf" title="Plano activo en PDF vectorial a tamaño real">PDF</button>
        <button data-export="png" title="Imagen PNG de alta resolución (≈200 ppp)">PNG</button>
        <button data-export="svg" title="Plano vectorial SVG">SVG</button>
        <button data-export="dxf" title="Plano activo para AutoCAD (DXF, mm de papel, capas por disciplina)">DXF</button>
      </div>
    </header>
    <main>
      <canvas id="plan"></canvas>
      <aside id="panel" class="panel"></aside>
    </main>
    <footer class="status">
      <span id="hint"></span>
      <span id="message" class="message"></span>
      <span id="coords"></span>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
